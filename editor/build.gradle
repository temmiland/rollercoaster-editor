plugins {
    id 'java-library'
}

group = 'land.temmi'
version = '0.1.0'

dependencies {
    implementation project(':preview-protocol')
    implementation project(':document')
    implementation project(':asset-pipeline')
}

sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeTestImplementation.extendsFrom implementation
}

dependencies {
    // Only the smoke test needs the engine - it verifies the exported tileset against the
    // real parser, same as asset-pipeline's own smoke test.
    smokeTestImplementation 'land.temmi:rollercoaster:0.1.0'
}

tasks.register('editorSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Checks ProjectController: new/open/save/saveAs and autosave restore, without a GUI.'
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'land.temmi.rollercoaster.editor.ui.ProjectControllerSmokeTest'
}
