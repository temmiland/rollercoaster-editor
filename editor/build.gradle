plugins {
    id 'java-library'
}

group = 'land.temmi'
version = '0.1.0'

dependencies {
    implementation project(':preview-protocol')
    implementation project(':document')
    implementation project(':asset-pipeline')
}

sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeTestImplementation.extendsFrom implementation
}

dependencies {
    // Only the smoke test needs the engine - it verifies the exported tileset against the
    // real parser, same as asset-pipeline's own smoke test.
    smokeTestImplementation 'land.temmi:rollercoaster:0.1.0'
    // Only for PreviewProcessSmokeTest, which spawns :preview as its own subprocess the same way
    // the real editor does - this is a normal Gradle project dependency (safe, ordered
    // resolution), not the ad-hoc cross-project project(':preview').tasks.named(...) access that
    // :platforms:desktop:run needs (there, :preview must stay off the *main* classpath; here, on
    // the smokeTest classpath of a JVM that never touches Swing, it's harmless).
    smokeTestImplementation project(':preview')
}

tasks.register('editorSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Checks ProjectController: new/open/save/saveAs and autosave restore, without a GUI.'
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'land.temmi.rollercoaster.editor.ui.ProjectControllerSmokeTest'
}

tasks.register('diagnosticNavigationSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Checks the clickable-diagnostic-line id parsing and panel-side jump dispatchers, without a GUI event loop.'
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'land.temmi.rollercoaster.editor.ui.DiagnosticNavigationSmokeTest'
}

def sampleGltfPath = project(':preview').file('src/main/resources/models/house.gltf').absolutePath

tasks.register('previewProcessSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Spawns the real preview process and asks it to compute bounds for a sample GLTF over the live protocol.'
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'land.temmi.rollercoaster.editor.ui.PreviewProcessSmokeTest'
    args sampleGltfPath
    doFirst {
        systemProperty 'trackside.editor.previewClasspath', sourceSets.smokeTest.runtimeClasspath.asPath
    }
}
