plugins {
    id 'application'
}

group = 'land.temmi'
version = '0.1.0'

application {
    mainClass = 'land.temmi.rollercoaster.editor.preview.PreviewMain'
}

dependencies {
    implementation project(':preview-protocol')
    implementation 'land.temmi:rollercoaster:0.1.0'
    implementation libs.gdx.backend.lwjgl3
    implementation "com.badlogicgames.gdx:gdx-platform:${libs.versions.gdx.get()}:natives-desktop"
}

tasks.named('run') {
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += ['-XstartOnFirstThread']
    }
}

sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeTestImplementation.extendsFrom implementation
}

tasks.register('previewSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Checks terrain-surface ray-march picking against a real TileMap; no GL context or window involved.'
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'land.temmi.rollercoaster.editor.preview.ClickPickerSmokeTest'
}

tasks.register('eventRuntimeSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Checks GameState/ConditionEvaluator/EventDispatcher against real engine event data; no GL context involved.'
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'land.temmi.rollercoaster.editor.preview.EventRuntimeSmokeTest'
}
